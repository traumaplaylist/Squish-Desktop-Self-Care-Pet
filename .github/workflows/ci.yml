name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint · typecheck · tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  windows:
    name: Windows — тесты, установщик, смоук
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build NSIS installer
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test (packaged app, koffi, SHQueryUserNotificationState)
        run: node scripts/smoke.mjs
        env:
          SQUISH_EXE: dist/win-unpacked/Squish.exe
      - name: E2E breaks (debug mode, real Windows overlay)
        run: node scripts/e2e-breaks.mjs
      - name: E2E tasks (quick input < 150 ms, check < 50 ms, coins)
        run: node scripts/e2e-tasks.mjs
      - name: E2E pet (check-in, hard day, first aid, needs, stages, petting)
        run: node scripts/e2e-pet.mjs
      - name: E2E onboarding, settings (live), pet's home
        run: node scripts/e2e-onboarding.mjs
      - name: E2E species (hamster from parts)
        run: node scripts/e2e-species.mjs
      - name: Idle CPU / RAM on Windows (packaged app)
        run: node scripts/measure-idle.mjs
        env:
          SQUISH_EXE: dist/win-unpacked/Squish.exe
      - name: Idle CPU / RAM on Windows — hamster
        run: node scripts/measure-idle.mjs
        env:
          SQUISH_EXE: dist/win-unpacked/Squish.exe
          SQUISH_SPECIES: hamster
      - name: Install → run → uninstall (silent)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/Squish-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\Squish\Squish.exe'
          if (-not (Test-Path $exe)) { throw "не установился: $exe" }
          Write-Host "установлен: $exe"
          $env:SQUISH_EXE = $exe
          node scripts/smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'смоук установленного приложения упал' }
          $un = Join-Path $env:LOCALAPPDATA 'Programs\Squish\Uninstall Squish.exe'
          Start-Process -FilePath $un -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path $exe) { throw 'не удалился' }
          Write-Host 'удалён'
      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: Squish-Setup
          path: dist/Squish-Setup-*.exe
          if-no-files-found: error
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-windows
          path: smoke-artifacts/
